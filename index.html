<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>The Arc</title>
<meta name="theme-color" content="#0b0f0d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Stencil+Display:wght@700;900&family=Barlow+Condensed:wght@500;600;700&display=swap">
<style>
:root{--ink:#efe9dc;--dim:#b8b2a4;--amber:#f0a640;--rust:#c2552d;--teal:#7fc4b8;--l:max(12px,env(safe-area-inset-left,0px));--r:max(12px,env(safe-area-inset-right,0px));--t:max(8px,env(safe-area-inset-top,0px));--b:max(10px,env(safe-area-inset-bottom,0px))}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#0b0f0d;color:var(--ink);font:600 15px/1.25 "Barlow Condensed",system-ui,sans-serif;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
#c{position:fixed;inset:0;width:100%;height:100%;display:block}
.hud{position:fixed;inset:0;pointer-events:none;transition:opacity .5s}
body.cine .hud.game,body.title .hud.game{opacity:0}
body.cine .touch,body.title .touch,body:not(.touch) .touch{display:none}

/* HUD: health (bottom-left) · toolbar (bottom-centre) · gun + ammo (bottom-right) · minimap (top-right) · bag (top-left) */
#hp{position:absolute;left:var(--l);bottom:var(--b);display:flex;align-items:center;gap:7px;padding:7px 10px;border-radius:10px;background:#0007}
#hp svg{width:18px;height:18px;flex:none}
#hp .bar{width:170px;height:9px;border-radius:5px;background:#ffffff1f;overflow:hidden}
#hp .bar i{display:block;height:100%;width:100%;border-radius:5px;background:linear-gradient(90deg,#c43b2a,#ef6a4a);transition:width .25s}
#hp em{font-style:normal;font-size:12px;letter-spacing:.12em;color:var(--amber);display:none}
#hp.hungry em{display:inline;animation:blink 1.2s infinite}
@keyframes blink{50%{opacity:.35}}
#tool{position:absolute;left:50%;bottom:var(--b);transform:translateX(-50%);display:flex;gap:5px;pointer-events:auto}
.slot{position:relative;width:54px;height:54px;border-radius:9px;background:#0b0d0cb8;box-shadow:inset 0 0 0 1.5px #ffffff26;display:grid;place-items:center;cursor:pointer}
.slot.on{box-shadow:inset 0 0 0 2px var(--amber),0 0 12px #f0a64055;background:#1a1610cc}
.slot.empty{opacity:.55}
.slot svg{width:40px;height:22px}
.slot em{position:absolute;left:5px;top:2px;font-style:normal;font-size:11px;color:var(--dim)}
.slot b{position:absolute;right:5px;bottom:2px;font-size:13px}
#gun{position:absolute;right:var(--r);bottom:var(--b);text-align:right;padding:6px 10px;border-radius:10px;background:#0007;text-shadow:0 1px 2px #000;line-height:1}
#gun span{display:block;font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);margin-bottom:3px}
#gun b{font-size:30px;font-weight:700}
#gun small{color:var(--dim);font-size:16px}
#mini{position:absolute;right:var(--r);top:var(--t);width:132px;height:132px;border-radius:50%;box-shadow:0 0 0 2px #ffffff33,0 4px 16px #0008;pointer-events:auto;cursor:pointer}
#minic{width:100%;height:100%;border-radius:50%;display:block}
#mini i{position:absolute;left:50%;top:-1px;transform:translateX(-50%);font:700 11px/1 "Barlow Condensed",sans-serif;font-style:normal;color:var(--ink);background:#000a;border-radius:6px;padding:1px 4px}
#bInv{position:absolute;left:var(--l);top:var(--t);width:42px;height:42px;border-radius:10px;border:0;background:#0007;box-shadow:inset 0 0 0 1.5px #ffffff26;display:grid;place-items:center;pointer-events:auto;cursor:pointer;padding:0}
#bInv svg{width:24px;height:24px}
#alert{position:absolute;left:50%;top:var(--t);transform:translateX(-50%);padding:5px 14px;border-radius:99px;background:#000a;font-size:15px;white-space:nowrap;display:none;text-shadow:0 1px 2px #000}
#alert.on{display:block}
#alert.rust{background:#6d1d0ccc;box-shadow:0 0 0 1px #ff8a5a88}
#toast{position:absolute;left:50%;top:calc(var(--t) + 36px);transform:translateX(-50%);font-size:15px;color:var(--amber);text-shadow:0 1px 3px #000;opacity:0;transition:opacity .3s;white-space:nowrap}
#toast.on{opacity:1}
body.shopping #tool{display:none}
body.touch #gun{bottom:auto;top:calc(var(--t) + 140px);padding:4px 8px}
body.touch #gun b{font-size:24px}
body.touch #mini{width:112px;height:112px}
body.touch .slot{width:46px;height:46px}
body.touch #hp .bar{width:120px}
/* inventory */
#inv{position:fixed;inset:0;z-index:7;display:none;place-items:center;background:#05080bcc}
#inv.on{display:grid}
#invp{width:min(520px,calc(100vw - 40px));padding:16px 18px;border-radius:14px;background:#12130fee;box-shadow:0 0 0 1.5px #ffffff22,0 10px 40px #000}
#invp h3{margin:0 0 10px;font:900 26px/1 "Big Shoulders Stencil Display",Impact,sans-serif;letter-spacing:.08em}
#invb .row{display:grid;grid-template-columns:repeat(auto-fill,minmax(86px,1fr));gap:6px}
#invb .it{display:grid;justify-items:center;gap:2px;padding:8px 4px;border-radius:9px;background:#ffffff0d;box-shadow:inset 0 0 0 1px #ffffff1a}
#invb .it svg{width:30px;height:20px}
#invb .it img.ic{width:48px;height:48px;object-fit:contain;filter:drop-shadow(0 2px 2px #000a)}
.slot img.ic{width:42px;height:42px;object-fit:contain}
body.touch .slot img.ic{width:36px;height:36px}
#invb .it b{font-size:20px}
#invb .it span{font-size:12px;color:var(--dim);text-transform:uppercase;letter-spacing:.06em}
#invb .stat{display:grid;grid-template-columns:auto 1fr;gap:6px 10px;align-items:center;margin:12px 0 6px;font-size:14px;color:var(--dim)}
#invb .stat .bar{height:8px;border-radius:4px;background:#ffffff1f;overflow:hidden}
#invb .stat i{display:block;height:100%}
#invb .obj{margin:10px 0 2px;color:var(--amber);font-size:16px}
#invb .day{margin:4px 0 0;color:var(--dim);font-size:14px;letter-spacing:.04em}
#invp{width:min(760px,calc(100vw - 24px));max-height:calc(100vh - 40px);overflow:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
#invb .tabs{display:flex;gap:6px;margin-bottom:8px}
#invb button{font:700 13px/1 "Barlow Condensed",system-ui,sans-serif;letter-spacing:.06em;text-transform:uppercase;color:var(--ink);background:#ffffff14;border:0;border-radius:7px;padding:7px 11px;cursor:pointer;box-shadow:inset 0 0 0 1px #ffffff22}
#invb .tabs button{font-size:17px;padding:8px 16px}
#invb button.on{background:var(--amber);color:#1a1208}
#invb .tabs .xb{margin-left:auto}
#invb h4{margin:12px 0 5px;font-size:12px;color:var(--dim);letter-spacing:.14em;text-transform:uppercase}
#invb .it button{margin-top:3px;padding:4px 8px;font-size:11px}
#invb .it.gear .nm{color:var(--ink);text-transform:none;font-size:13px;letter-spacing:0}
#invb .it.gear.on{box-shadow:inset 0 0 0 1.5px var(--teal)}
#invb .it small{font-size:11px;color:var(--dim)}
#invb .dur{width:80%;height:4px;border-radius:2px;background:#ffffff1f;overflow:hidden}#invb .dur i{display:block;height:100%}
#invb .tags{display:flex;gap:6px;flex-wrap:wrap;margin:2px 0 4px}
#invb .tag{font-size:13px;padding:2px 8px;border-radius:10px;color:var(--c);box-shadow:inset 0 0 0 1px var(--c)}
#invb .dim{color:var(--dim);font-size:13px;margin:6px 0}
#invb .ctabs{display:flex;gap:5px;flex-wrap:wrap}
#invb .recs{display:grid;gap:5px;margin-top:4px}
#invb .rec{display:grid;grid-template-columns:40px 1fr auto;gap:10px;align-items:center;padding:7px 10px;border-radius:9px;background:#ffffff0a;box-shadow:inset 0 0 0 1px #ffffff14}
#invb .rec>svg{width:28px;height:28px}
#invb .rec>img.ic{width:40px;height:40px;object-fit:contain}
#invb .rec.can{box-shadow:inset 0 0 0 1px #f0a64077;background:#f0a64012}
#invb .rec.lock{opacity:.45}
#invb .rec b{font-size:16px}#invb .rec em{font-style:normal;color:var(--dim);font-size:12px;margin-left:8px}
#invb .ing{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:12.5px;margin-top:2px}
#invb .ing .ok{color:#9ad06a}#invb .ing .no{color:#e0806a}
#invb .rec small{font-size:11px;color:var(--dim);text-align:right;max-width:110px}
#invb .rec button.dis{opacity:.4}
#prompt .pg,#bUse .pg{display:block;height:4px;margin-top:4px;border-radius:2px;background:#ffffff26;overflow:hidden}#prompt .pg i,#bUse .pg i{display:block;height:100%;background:var(--amber)}
#bUse small{font-size:10px;opacity:.75}
.slot u{position:absolute;left:4px;bottom:3px;height:3px;max-width:calc(100% - 8px);border-radius:2px;text-decoration:none}
.slot.warn{box-shadow:inset 0 0 0 1.5px #e0573d!important}
#invp .x{margin-top:10px;font-size:13px;color:#fff8;letter-spacing:.12em;text-align:center}

#cross{position:absolute;left:50%;top:50%;width:4px;height:4px;margin:-2px;border-radius:50%;background:#fffc;box-shadow:0 0 0 1px #0007}
#hitm{position:absolute;left:50%;top:50%;width:22px;height:22px;margin:-11px;opacity:0;transition:opacity .15s}
#hitm.on{opacity:1;transition:none}
#prompt{position:absolute;left:50%;top:62%;transform:translateX(-50%);font-size:16px;padding:5px 12px;border-radius:8px;background:#0009;display:none;text-shadow:0 1px 2px #000}
#prompt kbd{font:inherit;color:#1a1208;background:var(--amber);border-radius:4px;padding:0 6px;margin-right:6px}

#hurt{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,#0000 45%,#a01a0acc 100%);opacity:0}
#rustv{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,#8a2a1022 20%,#5a1406aa 100%);opacity:0;transition:opacity 1s}

/* subtitles + letterbox */
.lb{position:fixed;left:0;right:0;height:0;background:#000;transition:height .7s cubic-bezier(.6,0,.3,1);pointer-events:none;z-index:5}
#lbt{top:0}#lbb{bottom:0}
body.cine .lb{height:11vh}
#sub{position:fixed;left:50%;bottom:calc(var(--b) + 13vh);transform:translateX(-50%);max-width:min(720px,70vw);text-align:center;font-size:18px;line-height:1.3;padding:6px 14px;border-radius:8px;background:#000a;opacity:0;transition:opacity .25s;pointer-events:none;z-index:6}
body:not(.cine) #sub{bottom:calc(var(--b) + 18px);font-size:16px;max-width:min(560px,52vw)}
#sub.on{opacity:1}
#sub b{display:block;font-size:13px;letter-spacing:.12em;text-transform:uppercase;margin-bottom:1px}
#skip{position:fixed;right:calc(var(--r) + 8px);bottom:calc(var(--b) + 2vh);z-index:7;font-size:13px;color:#fff8;display:none;pointer-events:none}
body.cine #skip{display:block}

/* chapter card */
#card{position:fixed;inset:0;display:grid;place-items:center;text-align:center;pointer-events:none;z-index:8;opacity:0;transition:opacity 1.2s}
#card.on{opacity:1}
#card h2{margin:0;font:900 clamp(36px,8vw,76px)/.9 "Big Shoulders Stencil Display",Impact,sans-serif;letter-spacing:.06em;text-shadow:0 4px 30px #000}
#card p{margin:8px 0 0;font-size:18px;color:var(--dim);letter-spacing:.2em;text-transform:uppercase;text-shadow:0 2px 10px #000}

/* upgrade bench: compact tiles along the bottom */
#shop{position:fixed;left:50%;bottom:var(--b);transform:translateX(-50%);display:none;gap:6px;align-items:flex-end;z-index:4}
#shop.on{display:flex}
.tile{width:84px;padding:5px 5px 6px;border-radius:9px;background:#141310e6;box-shadow:inset 0 0 0 1.5px #ffffff22;display:grid;gap:4px;justify-items:center;cursor:pointer;pointer-events:auto;font-size:13px}
.tile img{width:72px;height:50px;display:block}
.tile .pips{display:flex;gap:3px;width:100%}
.tile .pips i{flex:1;height:5px;border-radius:2px;background:#ffffff22}
.tile .pips i.f{background:var(--amber)}
.tile .cost{display:flex;gap:4px;align-items:center;color:var(--ink)}
.tile .cost svg{width:12px;height:12px}
.tile.no{opacity:.55}.tile.max{opacity:.5}.tile.max .cost{color:var(--teal)}
.tile.buy{animation:pop .35s}
@keyframes pop{40%{transform:scale(1.12)}}
#shopx{width:38px;height:38px;border-radius:50%;border:0;background:#141310e6;color:var(--ink);font:700 18px/1 system-ui;box-shadow:inset 0 0 0 1.5px #ffffff22;pointer-events:auto;cursor:pointer;margin-left:4px}

/* touch controls: edges only */
.touch{position:fixed;inset:0;pointer-events:none;z-index:3}
#stick{position:absolute;width:110px;height:110px;margin:-55px;border-radius:50%;border:2px solid #ffffff30;background:#ffffff0a;display:none}
#stick i{position:absolute;left:50%;top:50%;width:46px;height:46px;margin:-23px;border-radius:50%;background:#ffffff40}
.btn{position:absolute;pointer-events:auto;border-radius:50%;border:2px solid #ffffff38;background:#0000004d;color:#fffd;display:grid;place-items:center;font:700 13px/1 "Barlow Condensed",sans-serif;letter-spacing:.06em;-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}
.btn.on{background:#ffffff33}
#bFire{right:calc(var(--r) + 14px);bottom:calc(var(--b) + 26px);width:74px;height:74px;border-color:#f0a64088}
#bFire svg{width:30px;height:30px}
#bJump{right:calc(var(--r) + 104px);bottom:calc(var(--b) + 12px);width:50px;height:50px}
#bRel{right:calc(var(--r) + 24px);bottom:calc(var(--b) + 116px);width:50px;height:50px}
#bThrow{right:calc(var(--r) + 84px);bottom:calc(var(--b) + 150px);width:50px;height:50px;font-size:10px}
#invb .two{display:grid;grid-template-columns:1fr 1fr;gap:10px}#invb .cb{display:flex;gap:4px}#invb .it .nm{font-size:12px}#invb p.dim button{margin-left:4px}
#bUse{right:calc(var(--r) + 96px);bottom:calc(var(--b) + 84px);min-width:56px;height:44px;border-radius:22px;padding:0 12px;display:none;background:#f0a640cc;color:#1a1208;border-color:#f0a640}

/* title */
#title{position:fixed;inset:0;z-index:9;display:none;flex-direction:column;justify-content:center;padding-left:calc(var(--l) + 5vw);background:linear-gradient(90deg,#060908ee 0%,#06090899 40%,#0000 70%)}
body.title #title{display:flex}
#title h1{margin:0;font:900 clamp(56px,13vw,124px)/.82 "Big Shoulders Stencil Display",Impact,sans-serif;letter-spacing:.04em;color:#e9e2d2;text-shadow:0 6px 40px #000}
#title .ch{font-size:17px;letter-spacing:.32em;text-transform:uppercase;color:var(--amber);margin:12px 0 22px}
#title button{appearance:none;display:block;width:220px;margin:0 0 10px;padding:11px 16px;border:0;border-radius:10px;font:700 19px/1 "Barlow Condensed",sans-serif;letter-spacing:.08em;text-transform:uppercase;text-align:left;cursor:pointer;color:#1a1208;background:var(--amber);box-shadow:0 4px 0 #7a4d12}
#title button.sec{background:#ffffff1a;color:var(--ink);box-shadow:inset 0 0 0 1.5px #ffffff33}
#title button:active{transform:translateY(3px);box-shadow:none}
#title .keys{margin-top:14px;font-size:14px;color:var(--dim);max-width:340px}
#title .load{font-size:16px;color:var(--dim);letter-spacing:.2em}

#dead{position:fixed;inset:0;z-index:8;display:none;place-items:center;background:#1a0503cc;text-align:center}
#dead h2{margin:0;font:900 52px/1 "Big Shoulders Stencil Display",Impact,sans-serif;letter-spacing:.06em}
#dead p{color:var(--dim);font-size:18px}

#scope{position:fixed;inset:0;pointer-events:none;display:none;background:radial-gradient(circle at center,#0000 0,#0000 31vh,#000 31.4vh)}
#scope.on{display:block}
#scope i{position:absolute;left:50%;top:50%;width:62vh;height:62vh;margin:-31vh;border-radius:50%;box-shadow:inset 0 0 40px #000c}
#scope i::before,#scope i::after{content:"";position:absolute;background:#000c}
#scope i::before{left:0;right:0;top:50%;height:1.5px;margin-top:-.75px}
#scope i::after{top:0;bottom:0;left:50%;width:1.5px;margin-left:-.75px}
#map{position:fixed;inset:0;z-index:7;display:none;place-items:center;align-content:center;background:#05080bdd}
#map.on{display:grid}
#map canvas{width:min(calc(100vh - 70px),calc(100vw - 40px),760px);aspect-ratio:1;border-radius:12px;box-shadow:0 0 0 2px #ffffff22,0 10px 40px #000}
#map p{margin:8px 0 0;font-size:14px;letter-spacing:.2em;color:var(--dim);text-align:center}
.btn.sm{width:46px;height:34px;border-radius:17px;font-size:12px}
.btn.lit{background:#f0a640aa;color:#1a1208}
#bAim{right:calc(var(--r) + 110px);bottom:calc(var(--b) + 132px)}


#rot{position:fixed;inset:0;z-index:20;background:#0b0f0d;display:grid;place-items:center;text-align:center;font-size:20px;color:var(--dim)}
#rot[hidden]{display:none}
#rot svg{width:64px;height:64px;margin-bottom:12px;stroke:var(--amber)}
</style>
</head>
<body class="title">
<canvas id="c"></canvas>

<div class="hud game">
  <div id="hp"><svg viewBox="0 0 16 16"><path d="M8 14S1.5 9.6 1.5 5.4C1.5 3.3 3.1 2 4.9 2 6.3 2 7.4 2.8 8 4c.6-1.2 1.7-2 3.1-2 1.8 0 3.4 1.3 3.4 3.4C14.5 9.6 8 14 8 14z" fill="#e0533b" stroke="#000"/></svg><div class="bar" id="hpb"><i></i></div><em>HUNGRY</em></div>
  <div id="tool"></div>
  <div id="gun"><span id="gunn">Carbine</span><b id="mag">20</b> <small id="res">/ 60</small></div>
  <div id="mini"><canvas id="minic"></canvas><i>N</i></div>
  <button id="bInv" aria-label="Inventory"><svg viewBox="0 0 24 24" fill="none" stroke="#efe9dc" stroke-width="1.8" stroke-linejoin="round"><path d="M5 9h14l-1 11H6z"/><path d="M9 9V6a3 3 0 0 1 6 0v3"/><path d="M9 13h6"/></svg></button>
  <div id="alert"></div>
  <div id="toast"></div>
  <div id="cross"></div>
  <svg id="hitm" viewBox="0 0 22 22"><path d="M3 3l5 5M19 3l-5 5M3 19l5-5M19 19l-5-5" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/></svg>
  <div id="prompt"></div>
</div>
<div id="scope"><i></i></div>
<div id="map"><canvas id="mapc"></canvas><p><span id="mapday"></span> · <b>M</b> / tap to close</p></div>
<div id="inv"><div id="invp"><div id="invb"></div><div class="x"><b>I</b> / tap outside to close</div></div></div>
<div id="hurt"></div><div id="rustv"></div>
<div class="lb" id="lbt"></div><div class="lb" id="lbb"></div>
<div id="sub"></div>
<div id="skip">tap to skip ›</div>
<div id="card"><div><h2 id="cardh"></h2><p id="cardp"></p></div></div>

<div id="shop"></div>

<div class="touch" id="touch">
  <div id="stick"><i></i></div>
  <div class="btn" id="bFire"><svg viewBox="0 0 30 30" fill="none" stroke="#fff" stroke-width="2.4"><circle cx="15" cy="15" r="9"/><path d="M15 2v7M15 21v7M2 15h7M21 15h7"/></svg></div>
  <div class="btn" id="bJump">JUMP</div>
  <div class="btn" id="bRel">RELOAD</div>
  <div class="btn" id="bThrow">THROW</div>
  <div class="btn" id="bUse">USE</div>
  <div class="btn sm" id="bAim">AIM</div>
</div>

<div id="title">
  <h1>THE ARC</h1>
  <div class="ch">Chapter 1 · Landfall</div>
  <div id="menu"><div class="load">LOADING THE VALLEY…</div></div>
  <div class="keys" id="keys"></div>
</div>
<div id="dead"><div><h2>YOU WENT DOWN</h2><p>Juno drags you back to the med tent…</p></div></div>
<div id="rot" hidden><div><svg viewBox="0 0 24 24" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="2" width="12" height="20" rx="2" transform="rotate(90 12 12)"/><path d="M4 7a8 8 0 0 1 5-4M20 17a8 8 0 0 1-5 4"/></svg><br>Turn your phone sideways</div></div>

<script type="importmap">{"imports":{"three":"./three.module.min.js"}}</script>
<script type="module" src="./game.js"></script>

</body>
</html>
